// Start from the server console with: mapcycle mapcycle.cfg
// Load this after any server settings. Entries run in file order and repeat.
// An entry's cvar overrides are restored before the next entry.
// Use pointlimit for all modes. fraglimit and capturelimit are aliases.
// vstr nextmap advances the cycle. map_restart repeats the current map.
// mapcycle stop restores the previous settings and nextmap command.

map wop_padcrash_dm17 {
	g_gametype 1
	timelimit 10
	pointlimit 15
}

map wop_diner {
	g_gametype 0
	timelimit 12
	pointlimit 30
}

map wop_westernsetCTL {
	g_gametype 8
	timelimit 16
	pointlimit 8
	g_friendlyFire 0
}
